<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Focus Media</title>
    
    <!-- Library Tailwind CSS (Via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // Aktifkan mode gelap berdasarkan preferensi sistem (otomatis)
            darkMode: 'media', 
            theme: {
                extend: {
                    colors: {
                        brand: '#3b82f6', // Warna biru khas
                    }
                }
            }
        }
    </script>
    
    <!-- Library jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* Custom scrollbar supaya lebih rapi */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        @media (prefers-color-scheme: dark) {
            ::-webkit-scrollbar-thumb { background: #475569; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Container Form -->
    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700">
        <div class="p-6 sm:p-8">
            
            <!-- Header Section -->
            <div class="text-center mb-8">
                <!-- Logo -->
                <img src="logo.png" alt="Focus Media Logo" class="w-24 h-24 mx-auto rounded-full object-cover shadow-sm mb-4 border-4 border-gray-50 dark:border-gray-700">
                
                <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white mb-2 tracking-tight">Focus Media</h2>
                <p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed">
                    Siap berkarya di dunia jurnalistik dan publikasi digital? Isi form di bawah ini untuk bergabung dan kembangkan potensi terbaikmu bersama kami!
                </p>
            </div>

            <!-- 
                Form Registration 
                Action mengarah ke Google Forms url formResponse
                Target di-set ke iframe tersembunyi agar halaman tidak pindah setelah submit
            -->
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
            <form id="regForm" action="https://docs.google.com/forms/d/e/1FAIpQLSfZdSSMzSpt25aN87ahwVGhXI0b3CmhwGkqd49zT-pnwZ5mbA/formResponse" method="POST" target="hidden_iframe" class="space-y-5">
                
                <!-- Input 1: Nama -->
                <div>
                    <label for="nama" class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Nama Lengkap</label>
                    <input type="text" id="nama" name="entry.324454032" required placeholder="Masukkan nama lengkapmu" 
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-brand focus:border-brand dark:bg-gray-700 dark:text-white transition-all outline-none">
                </div>

                <!-- Input 2: Kelas -->
                <div>
                    <label for="kelas" class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Kelas</label>
                    <input type="text" id="kelas" name="entry.1339392649" required placeholder="Contoh: 11 RPL 1" 
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-brand focus:border-brand dark:bg-gray-700 dark:text-white transition-all outline-none">
                </div>

                <!-- Input 3: Hobi -->
                <div>
                    <label for="hobi" class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Hobi</label>
                    <input type="text" id="hobi" name="entry.971481285" required placeholder="Apa kegiatan favoritmu di waktu luang?" 
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-brand focus:border-brand dark:bg-gray-700 dark:text-white transition-all outline-none">
                </div>

                <!-- Input 4: Alasan -->
                <div>
                    <label for="alasan" class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Alasan Bergabung</label>
                    <textarea id="alasan" name="entry.769401316" required rows="3" placeholder="Ceritakan kenapa kamu tertarik masuk Focus Media..." 
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-brand focus:border-brand dark:bg-gray-700 dark:text-white transition-all outline-none resize-none"></textarea>
                </div>

                <!-- Tombol Submit -->
                <div class="pt-3">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-xl transition-all duration-200 focus:ring-4 focus:ring-blue-500/50 flex justify-center items-center">
                        <span>Kirim Pendaftaran</span>
                    </button>
                </div>

                <!-- Notifikasi Sukses (Disembunyikan secara default) -->
                <div id="successAlert" class="hidden mt-4 p-4 bg-green-100 dark:bg-green-900/40 border border-green-400 dark:border-green-800 text-green-800 dark:text-green-300 rounded-lg text-center text-sm font-medium">
                    🎉 Pendaftaran Berhasil! Terima kasih sudah mendaftar.
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logika jQuery -->
    <script>
        $(document).ready(function() {
            var submitted = false;
            
            // Ketika form disubmit
            $('#regForm').on('submit', function() {
                submitted = true;
                
                // Ubah tombol jadi status loading
                $('#submitBtn')
                    .html('<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Mengirim...')
                    .prop('disabled', true)
                    .addClass('opacity-75 cursor-not-allowed');
            });

            // Ketika iframe selesai loading (tanda form Google berhasil menerima data)
            $('#hidden_iframe').on('load', function() {
                if (submitted) {
                    // Kosongkan form kembali
                    $('#regForm')[0].reset();
                    
                    // Kembalikan tombol seperti semula
                    $('#submitBtn')
                        .html('<span>Kirim Pendaftaran</span>')
                        .prop('disabled', false)
                        .removeClass('opacity-75 cursor-not-allowed');
                    
                    // Tampilkan pesan sukses selama 4 detik
                    $('#successAlert').slideDown().delay(4000).slideUp();
                    
                    submitted = false;
                }
            });
        });
    </script>
</body>
</html>
